services:
  aura-postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_db}
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aura-backend:
    build: ./backend
    container_name: aura-backend
    restart: unless-stopped
    depends_on:
      aura-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura_password}@aura-postgres:5432/${POSTGRES_DB:-aura_db}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      AURA_DEFAULT_LAT: ${AURA_DEFAULT_LAT:-28.4744}
      AURA_DEFAULT_LON: ${AURA_DEFAULT_LON:-77.5040}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend:/app

  aura-frontend:
    build: ./frontend
    container_name: aura-frontend
    restart: unless-stopped
    depends_on:
      aura-backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  aura_postgres_data:
